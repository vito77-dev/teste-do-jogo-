<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2b53">
<title>Missão na Cidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--fg:#fff1e8;--panel:rgba(16,24,52,.9);--line:#fff1e8;--btn:#ffa300;--btnfg:#1d2b53;--tx:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--px:"Press Start 2P","Courier New",monospace;--cm:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0d1b12;color:var(--fg);font-family:var(--tx);font-size:14px;line-height:1.35;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{image-rendering:crisp-edges;image-rendering:pixelated}
#gc{display:block;position:fixed;left:0;top:0;z-index:0}
img{image-rendering:pixelated}
button{font-family:var(--tx)}
#tl{position:fixed;z-index:5;left:10px;top:calc(10px + var(--sa));width:min(calc(100vw - 132px),380px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#hud,#vid,#soup{background:var(--panel);border:2px solid var(--line);border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.35);padding:5px 10px;font-size:13px;font-weight:700;align-self:flex-start;max-width:100%;box-sizing:border-box}
#soup{display:none}
#tr{position:fixed;z-index:6;right:10px;top:calc(10px + var(--sa));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.trb{display:flex;gap:8px}
#gear,#bagbtn{width:46px;height:46px;padding:0;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#gear img,#bagbtn img{width:28px;height:28px;pointer-events:none}
#mm{width:96px;height:96px;border:2px solid var(--line);border-radius:12px;background:#0b1a10;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.pad{z-index:5;position:fixed;left:14px;bottom:calc(16px + var(--sb));display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px}
.pad button,#atk,#jmp,#dash{background:var(--btn);color:var(--btnfg);border:2px solid var(--line);border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.4);font-size:16px;font-weight:700;touch-action:none;padding:0}
.pad button:active,#atk:active,#jmp:active,#dash:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.pad button img{width:28px;height:28px;pointer-events:none}
#atk,#jmp,#dash{z-index:5;position:fixed;right:18px;bottom:calc(30px + var(--sb));width:88px;height:88px;border-radius:50%;background:#ff004d;color:#fff1e8}
#jmp{bottom:calc(132px + var(--sb));background:#29adff;color:#1d2b53}
#dash{right:116px;bottom:calc(38px + var(--sb));width:66px;height:66px;font-size:13px;background:#00c853;color:#06280f}
#kb{display:none;position:fixed;z-index:5;left:50%;bottom:10px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:.9}
body.pc .pad,body.pc #atk,body.pc #jmp,body.pc #dash{display:none}
body.pc #kb{display:block}
#dlg{position:fixed;z-index:6;left:10px;bottom:calc(206px + var(--sb));display:none;align-items:flex-end;gap:10px;width:min(calc(100vw - 20px),470px);box-sizing:border-box}
body.pc #dlg{bottom:56px;left:16px}
@media (orientation:landscape) and (max-height:560px){body:not(.pc) #dlg{left:200px;right:230px;bottom:10px;width:auto}}
#face{flex:none;width:54px;height:54px;border:3px solid #1b1b2b;border-radius:16px;background:#ffd166;box-shadow:0 3px 0 rgba(0,0,0,.35);box-sizing:content-box}
body.pc #face{width:72px;height:72px}
.bub{position:relative;background:#fffdf2;color:#1b1b2b;border:3px solid #1b1b2b;border-radius:18px;padding:5px 14px 7px 12px;font-family:var(--cm);font-size:16px;font-weight:600;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.35);min-width:120px}
.bub::before{content:"";position:absolute;left:-10px;bottom:14px;width:14px;height:14px;background:#fffdf2;border-left:3px solid #1b1b2b;border-bottom:3px solid #1b1b2b;transform:rotate(45deg);border-radius:0 0 0 5px}
.bub b{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
#dnx{position:absolute;right:9px;bottom:3px;font-size:10px;color:#1b1b2b;animation:bl .7s steps(2) infinite;font-style:normal}
@keyframes bl{50%{opacity:0}}
#shop,#bag,#cfg{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:14px;display:none;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;box-sizing:border-box}
#shop{width:min(92vw,400px)}
#bag{width:min(88vw,320px)}
#cfg{width:min(88vw,340px)}
.cn{display:inline-block;width:14px;height:14px;background:var(--coin) center/contain no-repeat;image-rendering:pixelated;vertical-align:-2px}
#shopc{font-size:20px;font-weight:700}
#shop .cards{display:flex;gap:6px;justify-content:center}
#shop button[data-i]{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;background:#37474f;color:#fff1e8;border:2px solid rgba(255,255,255,.35);border-radius:12px;font-weight:700}
#shop button[data-i]:active{background:#7e2553}
#shop .pr{font-size:15px}
#shop img{width:40px;height:40px}
#shopx,#bagx,#cfgx{align-self:flex-end;width:44px;height:44px;padding:0;background:var(--btn);color:var(--btnfg);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.4);font-size:18px;font-weight:700}
#bag .t,#cfg .t{font-size:19px;font-weight:700;color:#ffec27}
#bagb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);border-radius:10px}
.slot.off{opacity:.3}
.slot img{width:62%}
.slot small{position:absolute;right:6px;bottom:3px;font-size:15px;font-weight:700;color:#ffec27}
.lb{width:130px;height:10px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-top:3px;box-sizing:content-box}
.lb i{display:block;height:100%;background:#00e436}
#cfgb{display:flex;flex-direction:column;gap:12px}
#cfg .row{display:flex;justify-content:space-between;align-items:center;font-size:18px}
#cfg .bar{height:10px;border-radius:6px;background:rgba(128,128,128,.35);overflow:hidden}
#cfg .bar i{display:block;height:100%;background:#ff004d;border-radius:6px}
.cb{border:2px solid var(--line);border-radius:12px;padding:11px;background:#29adff;color:#10233f;font-size:16px;font-weight:700}
.cb:active{transform:translateY(2px)}
#over{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(0,0,0,.78);color:#ff004d;font-family:var(--px);font-size:22px;text-align:center}
#over button{background:var(--btn);color:var(--btnfg);border:2px solid var(--line);border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.4);padding:12px 24px;font-size:18px;font-weight:700}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,16,36,.7)}
#menu .mc{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
#menu .mt{font-family:var(--px);font-size:22px;line-height:1.5;color:#ffec27;text-shadow:3px 3px 0 #7e2553}
#menu .ms{font-size:15px;font-weight:700;color:#c9d3ff}
#play{font-family:var(--px);font-size:16px;padding:16px 36px;border:3px solid var(--line);border-radius:14px;background:#00e436;color:#10331c;box-shadow:0 6px 0 rgba(0,0,0,.4)}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="tl"><div id="hud"><span id="hmsg">Missão: entre na casa de telhado vermelho.</span></div><div id="vid" aria-label="Vida"></div><div id="soup"></div></div>
<div id="tr"><div class="trb"><button id="bagbtn" aria-label="Mochila"><img data-ic="bag" alt=""></button><button id="gear" aria-label="Configurações"><img data-ic="gear" alt=""></button></div><canvas id="mm" width="48" height="48"></canvas></div>
<div id="bag"><div class="t">Mochila</div><div id="bagb"></div><button id="bagx" aria-label="Fechar">X</button></div>
<div id="cfg"><div class="t">Configurações</div><div id="cfgb"></div><button class="cb" id="cfgmode"></button><button class="cb" id="cfgfs">Tela cheia</button><button class="cb" id="cfgmenu">Menu principal</button><button id="cfgx" aria-label="Fechar">X</button></div>
<div id="shop"><div id="shopc"></div><div class="cards"><button data-i="pot" aria-label="Poção de vida"><img data-ic="pot" alt=""><span class="pr"><i class="cn"></i> 6</span></button><button data-i="sw" aria-label="Espada nova"><img data-ic="sword" alt=""><span class="pr"><i class="cn"></i> 12</span></button><button data-i="ar" aria-label="Armadura nova"><img data-ic="armor" alt=""><span class="pr"><i class="cn"></i> 15</span></button><button data-i="pa" aria-label="Calça de armadura"><img data-ic="pants" alt=""><span class="pr"><i class="cn"></i> 10</span></button><button data-i="bo" aria-label="Sapatos"><img data-ic="boots" alt=""><span class="pr"><i class="cn"></i> 8</span></button></div><button id="shopx" aria-label="Fechar">X</button></div>
<div id="over"><span>VOCÊ MORREU</span><button id="again">Jogar de novo</button></div>
<div id="menu"><div class="mc"><img data-ic="sword" alt="" style="width:72px;height:72px"><div class="mt">MISSÃO<br>NA CIDADE</div><div class="ms">Uma aventura pixelada</div><button id="play">JOGAR</button></div></div>
<div id="dlg"><canvas id="face" width="18" height="18"></canvas><div class="bub"><b id="dwho"></b><span id="dtxt"></span><i id="dnx">▼</i></div></div>
<div id="kb">WASD/Setas andar · Espaço ou clique: espada · Shift: esquiva · E: pular · Q: poção · F: loja</div>
<div class="pad">
<span></span><button data-k="f" aria-label="Cima"><img data-ic="arr" alt=""></button><span></span>
<button data-k="l" aria-label="Esquerda"><img data-ic="arr" alt="" style="transform:rotate(-90deg)"></button><span></span><button data-k="r" aria-label="Direita"><img data-ic="arr" alt="" style="transform:rotate(90deg)"></button>
<span></span><button data-k="b" aria-label="Baixo"><img data-ic="arr" alt="" style="transform:rotate(180deg)"></button><span></span>
</div>
<button id="atk">Espada</button>
<button id="jmp">Pular</button>
<button id="dash">Esquiva</button>
<script>
const $=id=>document.getElementById(id);
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function css(n){return typeof n==='number'?'#'+n.toString(16).padStart(6,'0'):n}
function shade(c,a){const n=parseInt(css(c).slice(1),16),cl=v=>Math.max(0,Math.min(255,v));return '#'+((1<<24)|(cl((n>>16)+a)<<16)|(cl(((n>>8)&255)+a)<<8)|cl((n&255)+a)).toString(16).slice(1)}
function rng(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let mode=LS.get('mnc_mode');
if(mode!=='pc'&&mode!=='cel')mode=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)?'cel':'pc';
// ícones pixel art 8x8
const ICD={
tom:[['...gg...','.ggggg..','.rrgrrr.','rrrrrrrr','rwrrrrrr','rwrrrrrd','.rrrrrd.','..dddd..'],{g:'#3a9d23',r:'#e53935',d:'#b71c1c',w:'#ff8a80'}],
abo:[['...gg...','.ooggoo.','oodoodoo','oodoodoo','oodoodoo','oodoodoo','.ooddoo.','..oooo..'],{o:'#f28c28',d:'#c4691a',g:'#2e7d32'}],
pim:[['....bb..','...gg...','..gGGg..','.gGGGGg.','.gGGGGg.','.gGGGGg.','..gGGg..','...gg...'],{b:'#8d5a2b',g:'#2e7d32',G:'#66bb6a'}],
pot:[['...bb...','...ww...','...ww...','..wrrw..','.wrRrrw.','.wrrrrw.','.wrrrrw.','..wwww..'],{b:'#8d5a2b',w:'#cfd8dc',r:'#e53935',R:'#ff8a80'}],
sword:[['...ww...','...ws...','...ws...','...ws...','...ws...','.yyyyyy.','...bb...','...yy...'],{w:'#eceff1',s:'#90a4ae',y:'#ffd54f',b:'#8d5a2b'}],
armor:[['.aa..aa.','aaa..aaa','aaaaaaaa','.aaaaaa.','.aayyaa.','.aaaaaa.','.aaaaaa.','..dddd..'],{a:'#9aa7b8',y:'#ffd54f',d:'#546e7a'}],
pants:[['yyyyyyyy','aaaaaaaa','aaaaaaaa','aaa..aaa','aaa..aaa','aaa..aaa','aaa..aaa','ddd..ddd'],{a:'#9aa7b8',y:'#ffd54f',d:'#546e7a'}],
boots:[['.bbbb...','.bbbb...','.bbbb...','.bbbb...','.bbbbbb.','.bbbbbbb','dddddddd','........'],{b:'#a1673f',d:'#3e2723'}],
coin:[['..oooo..','.oyyyyo.','oyyYyyyo','oyyYyyyo','oyyyyyyo','oyyyyyyo','.oyyyyo.','..oooo..'],{o:'#b8860b',y:'#f5c518',Y:'#ffe082'}],
bag:[['...bb...','..b..b..','.bbbbbb.','bbbbbbbb','bbbyybbb','bbbbbbbb','bbbbbbbb','.dddddd.'],{b:'#ab5236',y:'#ffec27',d:'#5a3b1e'}],
gear:[['...gg...','.g.gg.g.','..gggg..','ggg..ggg','ggg..ggg','..gggg..','.g.gg.g.','...gg...'],{g:'#c2c3c7'}],
arr:[['...aa...','..aaaa..','.aaaaaa.','aaaaaaaa','...aa...','...aa...','...aa...','...aa...'],{a:'#1d2b53'}],
heart:[['.RR..RR.','RRRRRRRR','RwRRRRRR','RRRRRRRR','.RRRRRR.','..RRRR..','...RR...'],{R:'#ff3b5c',w:'#ffc2cf'}]
};
const ICc={},IC={};
for(const k in ICD){const rows=ICD[k][0],c=mk(8,rows.length),x=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((ch,i)=>{const col=ICD[k][1][ch];if(col){x.fillStyle=col;x.fillRect(i,j,1,1)}}));ICc[k]=c;IC[k]=c.toDataURL()}
document.documentElement.style.setProperty('--coin','url("'+IC.coin+'")');
document.querySelectorAll('img[data-ic]').forEach(e=>e.src=IC[e.dataset.ic]);

// ===== tela (pixel art suave) =====
const U=10;
const cv=$('gc'),X=cv.getContext('2d');
let W=320,H=180,camX=0,camY=0,T=0;
function fit(){const dpr=window.devicePixelRatio||1,base=Math.max(1,Math.round(Math.min(innerWidth,innerHeight)/(mode==='pc'?340:260))),D=Math.max(1,Math.round(base*dpr)),cs=D/dpr;W=Math.ceil(innerWidth/cs);H=Math.ceil(innerHeight/cs);cv.width=W;cv.height=H;cv.style.width=(W*cs)+'px';cv.style.height=(H*cs)+'px';X.imageSmoothingEnabled=false}
addEventListener('resize',fit);
const P=v=>Math.round(v*U);
function R(a,b,c,d){X.fillRect(P(a),P(b),P(c)-P(a),P(d)-P(b))}
function rp(x,y,w,h,col){X.fillStyle=col;X.fillRect(x,y,w,h)}
function disc(cx,cy,rx,ry,col){X.fillStyle=col;for(let j=-ry;j<=ry;j++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(j*j)/(ry*ry+.0001)))+.5);X.fillRect(cx-w,cy+j,w*2+1,1)}}
function shadow(px,py,rx){X.fillStyle='rgba(0,0,0,.22)';X.fillRect(px-rx,py-1,rx*2,3);X.fillRect(px-rx+2,py-2,Math.max(1,rx*2-4),5)}
function txt(s,x,y,col){X.font='8px "Press Start 2P","Courier New",monospace';X.textAlign='center';X.textBaseline='alphabetic';X.fillStyle='#000';X.fillText(s,x+1,y+1);X.fillText(s,x-1,y);X.fillText(s,x,y+1);X.fillStyle=col||'#fff1e8';X.fillText(s,x,y)}
function tex(w,h,base,sp,seed){const c=mk(w,h),x=c.getContext('2d'),r=rng(seed||11);x.fillStyle=base;x.fillRect(0,0,w,h);sp.forEach(s=>{x.fillStyle=s[0];for(let i=0;i<s[1];i++)x.fillRect(Math.floor(r()*w),Math.floor(r()*h),s[2]||1,1)});return c}
const gT=tex(48,48,'#5c9e4f',[['#52914a',70],['#6cb05d',55],['#4a8443',24,2],['#7ac26b',12]],3);
{const x=gT.getContext('2d'),r=rng(9);[['#fff6d6',4],['#ffe066',4],['#ff9ec2',3],['#c9b6ff',2]].forEach(f=>{x.fillStyle=f[0];for(let i=0;i<f[1];i++){const a=Math.floor(r()*46),b=Math.floor(r()*46);x.fillRect(a,b,2,1);x.fillRect(a,b+1,1,1)}})}
const fT=tex(48,48,'#3b7742',[['#336b3c',70],['#468a4c',40],['#2b5c34',20,2],['#6b8e3a',8]],5);
const rT=tex(32,32,'#4d535c',[['#454b53',50],['#575d66',30]],7);
const flT=(()=>{const c=tex(16,16,'#b0875d',[['#a07a52',22],['#bf9769',16]],5),x=c.getContext('2d');x.fillStyle='#8d6a45';x.fillRect(0,7,16,1);x.fillRect(0,15,16,1);x.fillRect(5,0,1,7);x.fillRect(11,8,1,7);return c})();
const pGrass=X.createPattern(gT,'repeat'),pForest=X.createPattern(fT,'repeat'),pRoad=X.createPattern(rT,'repeat'),pFloor=X.createPattern(flT,'repeat');

// sprites com contorno
function outline(c,col){const w=c.width+2,h=c.height+2,o=mk(w,h),x=o.getContext('2d');x.drawImage(c,1,1);const d=x.getImageData(0,0,w,h).data,al=(i,j)=>i<0||j<0||i>=w||j>=h?0:d[(j*w+i)*4+3];x.fillStyle=col;for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(al(i,j)>10)continue;if(al(i-1,j)>10||al(i+1,j)>10||al(i,j-1)>10||al(i,j+1)>10)x.fillRect(i,j,1,1)}return o}
const HEART=outline(ICc.heart,'#4a0d1c');
const SPC={};
function personSprite(o){
 const key=[o.sh,o.skin,o.hair,o.dir,o.fr,o.armor|0,o.pants|0,o.boots|0,o.cape|0,o.mon|0].join('|');
 if(SPC[key])return SPC[key];
 const left=o.dir==='l',side=left||o.dir==='r',back=o.dir==='u';
 const c=mk(16,22),x=c.getContext('2d');
 const Q=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};
 const sh=css(o.sh),shD=shade(sh,-40),shL=shade(sh,26),sk=css(o.skin),skD=shade(sk,-30),hr=css(o.hair),hrD=shade(hr,-28);
 const pn=o.pants?'#9aa7b8':'#2b3a67',pnD=o.pants?'#6f7d8f':'#1f2a4d',sho=o.boots?'#5a3b1e':'#3b2a1a',GOLD='#ffd54f',ST='#9aa7b8',STD='#6f7d8f',STL='#c5cfdc',BT='#8d5a2b';
 const f=o.fr,eye=o.mon?'#ff2b2b':'#1a1a1a';
 if(!side){
  const lo=f===1?-1:0,ro=f===2?-1:0,la=f===2?1:f===1?-1:0;
  Q(5,14,3,5+lo,pn);Q(8,14,3,5+ro,pn);Q(7,14,1,5+lo,pnD);Q(10,14,1,5+ro,pnD);
  if(o.pants)Q(5,14,6,1,GOLD);
  if(o.boots){Q(5,16+lo,3,3,BT);Q(8,16+ro,3,3,BT)}
  Q(5,19+lo,3,2,sho);Q(8,19+ro,3,2,sho);
  Q(2,8+la,2,5,sh);Q(2,8+la,1,5,shD);Q(2,13+la,2,1,sk);
  Q(12,8-la,2,5,sh);Q(13,8-la,1,5,shD);Q(12,13-la,2,1,sk);
  if(o.armor){Q(4,8,8,6,ST);Q(11,8,1,6,STD);Q(4,8,8,1,STL);if(!back)Q(7,9,2,3,GOLD);Q(2,8+la,2,2,GOLD);Q(12,8-la,2,2,GOLD);Q(4,13,8,1,GOLD)}

 X.drawImage(spr,fx-spr.ax,fy-spr.ay-jy);
 if(me.dir!=='u')drawSword(hx_,hy_,ang,swordB);
 if(swing>=0){X.strokeStyle='rgba(255,255,255,.75)';X.lineWidth=3;X.beginPath();X.arc(hx_,hy_,14,a0-1.3,ang);X.stroke()}}
function drawBeacon(x,z,col){const px=P(x),pz=P(z);if(px<camX-60||px>camX+W+60||pz<camY-20||pz>camY+H+120)return;const p=.5+.5*Math.sin(T*3);
 X.globalAlpha=.2+.12*p;X.fillStyle=col;X.fillRect(px-3,pz-110,6,110);X.globalAlpha=.3+.2*p;disc(px,pz,10+Math.round(p*3),5+Math.round(p*2),col);X.globalAlpha=1}
// minimapa
const mmC=$('mm'),M=mmC.getContext('2d');M.imageSmoothingEnabled=false;
function drawMini(){const S=48,Rg=36,k=S/(Rg*2),tx=x=>Math.round((x-me.x+Rg)*k),ty=z=>Math.round((z-me.z+Rg)*k);
 const rw=(x0,z0,x1,z1)=>{const a=tx(x0),b=ty(z0);M.fillRect(a,b,Math.max(1,tx(x1)-a),Math.max(1,ty(z1)-b))};
 M.fillStyle='#4d8a43';M.fillRect(0,0,S,S);
 M.fillStyle='#2f6b38';rw(15,15,135,135);rw(22,-10,135,15);rw(-10,22,15,135);
 M.fillStyle='#7b818a';rw(-120,-3,22,3);rw(-3,-120,3,22);rw(CX-35,CZ-3,CX+35,CZ+3);rw(CX-3,CZ-35,CX+3,CZ+35);
 M.fillStyle='#d7c9a8';bld.forEach(b=>rw(b.x-b.w/2,b.z-b.d/2,b.x+b.w/2,b.z+b.d/2));
 M.fillStyle='#e0473a';rw(hx-4.5,hz-4.5,hx+4.5,hz+4.5);
 M.fillStyle='#ffec27';M.fillRect(tx(5)-1,ty(13)-1,3,3);
 M.fillStyle='#f5c518';wcoins.forEach(c=>{if(c.on&&Math.abs(c.x-me.x)<Rg&&Math.abs(c.z-me.z)<Rg)M.fillRect(tx(c.x),ty(c.z),1,1)});
 M.fillStyle='#ff2d55';foes.forEach(f=>{if(Math.abs(f.x-me.x)<Rg&&Math.abs(f.z-me.z)<Rg)M.fillRect(tx(f.x)-1,ty(f.z)-1,2,2)});
 if((state===0||state===2)&&Math.floor(T*2)%2===0){const a=Math.max(1,Math.min(S-4,tx(hx)-1)),b=Math.max(1,Math.min(S-4,ty(hz)-1));M.fillStyle='#fff';M.fillRect(a-1,b-1,5,5);M.fillStyle='#e0473a';M.fillRect(a,b,3,3)}
 M.fillStyle='#1b1b2b';M.fillRect(S/2-2,S/2-2,5,5);M.fillStyle=Math.floor(T*3)%2?'#fff':'#00e5ff';M.fillRect(S/2-1,S/2-1,3,3)}
function render(){
 camX=Math.round(me.x*U-W/2);camY=Math.round(me.z*U-H/2);
 X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;
 X.fillStyle='#5c9e4f';X.fillRect(0,0,W,H);
 X.translate(-camX,-camY);
 X.fillStyle=pGrass;X.fillRect(camX,camY,W,H);
 X.fillStyle=pForest;R(15,15,135,135);R(22,-10,135,15);R(-10,22,15,135);
 drawRoads();
 const inV=(x,z,m)=>{const px=P(x),pz=P(z);return px>camX-m&&px<camX+W+m&&pz>camY-m&&pz<camY+H+m};
 bld.forEach(b=>{if(inV(b.x,b.z,b.w*U))drawBuilding(b)});
 drawHouseGround();drawShopStall();drawFountain();
 wcoins.forEach(c=>{if(c.on&&inV(c.x,c.z,20))drawCoin(c)});
 puffs.forEach(p=>{X.globalAlpha=.55*(1-p.t/.3);disc(P(p.x),P(p.z)-3,4,3,'#fff');X.globalAlpha=1});
 const L=[];
 trees.forEach(t=>L.push({z:t.z,k:0,o:t}));
 forest.forEach(t=>{if(inV(t.x,t.z,60))L.push({z:t.z,k:1,o:t})});
 npcs.forEach(n=>{if(n.inn&&roofOn)return;if(inV(n.x,n.z,30))L.push({z:n.z,k:2,o:n})});
 if(!roofOn)L.push({z:hz-3,k:3});
 foes.forEach(f=>{if(inV(f.x,f.z,40))L.push({z:f.z,k:4,o:f})});
 dying.forEach(f=>{if(inV(f.x,f.z,40))L.push({z:f.z,k:5,o:f})});
 drops.forEach(h=>{if(inV(h.x,h.z,20))L.push({z:h.z,k:7,o:h})});
 L.push({z:me.z,k:6});
 L.sort((a,b)=>a.z-b.z);
 L.forEach(e=>{
  if(e.k===0||e.k===1){const t=e.o,spr=e.k===0?fruitSprite(t.col,t.got?0:1):PINES[t.v],near=Math.abs(t.x-me.x)<2&&t.z>me.z&&t.z-me.z<3.2;
   shadow(P(t.x),P(t.z)-1,e.k?9:11);if(near)X.globalAlpha=.55;X.drawImage(spr,P(t.x)-spr.ax,P(t.z)-spr.ay);X.globalAlpha=1}
  else if(e.k===2){const n=e.o;drawPerson({sh:n.sh,skin:SK,hair:n.hair,dir:dirTo(n,me),fr:0},n.x,n.z,n.s||1,0)}
  else if(e.k===3){const px=P(hx-2.5),pz=P(hz-3);shadow(px,pz+1,8);disc(px,pz-4,7,5,'#1b1b1b');disc(px,pz-4,6,4,'#3a3a3a');disc(px,pz-5,5,3,'#8a5a2b');X.fillStyle='rgba(255,255,255,.5)';X.fillRect(px-2,pz-12-Math.round(Math.sin(T*3)*1),1,4);X.fillRect(px+2,pz-14,1,4)}
  else if(e.k===4){const f=e.o,s=f.s*(f.pulse>0?1.15:1),fr=f.mv?[1,0,2,0][Math.floor(f.ph/1.6)%4]:0;drawPerson({sh:LV[f.lv],skin:'#7cae4d',hair:shade(LV[f.lv],-40),dir:f.dir,fr:fr,mon:1},f.x,f.z,s,0)}
  else if(e.k===5){const f=e.o,spr=personSprite({sh:LV[f.lv],skin:'#7cae4d',hair:shade(LV[f.lv],-40),dir:f.dir,fr:0,mon:1}),fx=P(f.x),fy=P(f.z);X.save();X.translate(fx,fy);X.rotate(Math.min(f.t*6,1.57));X.globalAlpha=Math.max(0,1-Math.max(0,f.t-.5)/.7);X.scale(f.s,f.s);X.drawImage(spr,-spr.ax,-spr.ay);X.restore()}
  else if(e.k===7)drawHeart(e.o)
  else if(e.k===6)drawMe()});
 if(roofOn)drawHouseRoof();
 drawBeacon(40,40,'#ff5252');drawBeacon(CX,CZ,'#4fc3f7');
 foes.forEach(f=>{if(inV(f.x,f.z,40))txt('NV'+f.lv,P(f.x),P(f.z)-Math.round(24*f.s)-4,'#fff1e8')});
 floaters.forEach(f=>txt(f.txt,P(f.x),P(f.z)-26-Math.round(f.t*18),f.col));
 X.setTransform(1,0,0,1,0,0);
 if(flash>0){X.fillStyle='rgba(255,40,60,'+(.3*Math.min(1,flash/.22))+')';X.fillRect(0,0,W,H)}
 drawMini()}

let last=performance.now();
function loop(now){requestAnimationFrame(loop);now=now||performance.now();const dt=Math.max(0,Math.min((now-last)/1000||0,.05));last=now;
 if(!window.logged||dead){T+=dt;render();return}
 update(dt);render()}
dlg.style.display='none';
setMode(mode);
showLives();
requestAnimationFrame(loop);
